<section id="partners" class="partners-band">
  <div class="container sponsors-logos">
    <span class="sponsors-logos-label">Our Partners</span>
    <div class="partners-rows">
      @for (row of partnerRows; track $index) {
        <div class="partners-grid">
          @for (group of row; track group[0].logo) {
            <div class="partner-group" [class.partner-group--pair]="group.length > 1">
              @for (p of group; track p.logo) {
                <div class="partner-tile">
                  <img [src]="p.logo" [alt]="p.name" loading="lazy" />
                </div>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
</section>
